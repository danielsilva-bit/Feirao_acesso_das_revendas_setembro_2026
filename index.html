<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard de Lojas - Estoque</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e1e5eb;
    --text: #1f2933;
    --muted: #667085;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
  }
  #user-box {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--muted);
  }
  #user-box button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  #user-box button:hover { background: #f0f2f5; }

  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }

  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 420px;
    margin: 60px auto;
  }
  #login-screen h2 { margin-top: 0; }
  #login-screen p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  #login-screen input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-top: 16px;
  }
  #login-screen input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  }
  #login-screen button {
    width: 100%;
    margin-top: 12px;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  #login-screen button:hover { background: var(--primary-dark); }
  #login-screen button:disabled { opacity: .6; cursor: not-allowed; }
  #login-status {
    margin-top: 14px;
    font-size: 13px;
    display: none;
  }
  #login-status.error { color: var(--danger); display: block; }
  #login-status.info { color: var(--muted); display: block; }

  #dashboard { display: none; }

  .toolbar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }
  .field input, .field select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    min-width: 160px;
    background: white;
  }
  #search-field input { min-width: 240px; }

  .actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .btn {
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #eef2ff; color: var(--primary-dark); }
  .btn-secondary:hover { background: #e0e7ff; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  #status-msg {
    font-size: 13px;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
  }
  #status-msg.success { background: #ecfdf3; color: var(--success); display: block; }
  #status-msg.error { background: #fef2f2; color: var(--danger); display: block; }
  #status-msg.info { background: #eff6ff; color: var(--primary-dark); display: block; }

  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: auto;
    max-height: 65vh;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    white-space: nowrap;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #f8fafc;
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    z-index: 1;
  }
  tbody td {
    padding: 9px 12px;
    border-bottom: 1px solid #f0f2f5;
  }
  tbody tr:hover { background: #f8fafc; }

  #results-count {
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 24px;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>📊 Dashboard de Lojas - Estoque</h1>
  <div id="user-box" style="display:none;">
    <span id="user-email"></span>
    <button id="logout-btn">Sair</button>
  </div>
</header>

<main>

  <div id="login-screen">
    <h2>Acesso restrito</h2>
    <p>Este link é público, mas os dados só são exibidos para e-mails autorizados.<br/>
       Digite seu e-mail para continuar.</p>
    <input type="email" id="login-email" placeholder="seu.email@usadosbr.com" autocomplete="email" />
    <button id="login-btn">Entrar</button>
    <div id="login-status"></div>
  </div>

  <div id="dashboard">
    <div id="status-msg"></div>

    <div class="toolbar">
      <div class="field" id="search-field">
        <label>Buscar (todas as colunas)</label>
        <input type="text" id="f-search" placeholder="Digite para buscar..." />
      </div>
      <div class="field">
        <label>GP</label>
        <select id="f-gp"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label>GN</label>
        <select id="f-gn"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label>Faixa Estoque</label>
        <select id="f-faixa-estoque"><option value="">Todas</option></select>
      </div>
      <div class="field">
        <label>Faixa de Atualização</label>
        <select id="f-faixa-atualizacao"><option value="">Todas</option></select>
      </div>
      <div class="field">
        <label>P</label>
        <select id="f-p"><option value="">Todos</option></select>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" id="refresh-btn">↻ Atualizar</button>
        <button class="btn btn-secondary" id="clear-filters-btn">Limpar filtros</button>
        <button class="btn btn-secondary" id="download-btn">⬇ Baixar CSV</button>
        <button class="btn btn-primary" id="email-btn">✉ Enviar para meu e-mail</button>
      </div>
    </div>

    <div id="results-count"></div>

    <div class="table-wrap">
      <table>
        <thead><tr id="table-head"></tr></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

</main>

<footer>Usadosbr &middot; Dashboard interno &middot; acesso e ações são registrados</footer>

<script>
/* ==================== CONFIGURAÇÃO ====================
   Preencha depois de seguir o README.md:
   1) LOG_WEBAPP_URL: a URL do seu Web App do Apps Script (Code.gs)
   O SHEET_ID abaixo já está preenchido com a planilha
   "Lojas - Feirão_Set/26".
*/
const SHEET_ID = '1MiIT8ctq8HLP63oG34ERkyBPyhEiu-OrUCjpv7iAse0';
const DATA_TAB = 'Base_lojas';
const AUTH_TAB = 'Usuários_permitidos';
const LOG_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzfCZ0o2euEGjE9PbKdHIYMAKdYYWm8IluHGYnkDrrWztMGSs8-XkhvL0_1ytoZNQJpAg/exec';

// Colunas exibidas, na ordem pedida: A,B,C,D,E,G,H,J,K,L,M,N,O,P
const EXPOSED_HEADERS = [
  'REV_CNPJ',
  'REV_NOME',
  'GP_NOME',
  'GN_NOME',
  'Resp. Onboarding',
  'Email Onboarding',
  'Email GN',
  'Estoque',
  'Faixa Estoque',
  'Ultima Atualização',
  'Faixa de Atualização',
  'Login',
  'Senha',
  'P'
];

const FILTER_COLUMNS = {
  'f-gp': 'GP_NOME',
  'f-gn': 'GN_NOME',
  'f-faixa-estoque': 'Faixa Estoque',
  'f-faixa-atualizacao': 'Faixa de Atualização',
  'f-p': 'P'
};

/* ==================== ESTADO ==================== */
let userEmail = null;
let allHeaders = EXPOSED_HEADERS;
let allRows = [];

/* ==================== SESSÃO (localStorage, expira por dia) ==================== */
function todayStr() { return new Date().toISOString().split('T')[0]; }

function loadSession() {
  try {
    const raw = localStorage.getItem('estoque_lojas_session');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s.date !== todayStr()) return null;
    return s;
  } catch (e) { return null; }
}
function saveSession(s) {
  try { localStorage.setItem('estoque_lojas_session', JSON.stringify(s)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem('estoque_lojas_session'); } catch (e) {}
}

/* ==================== GVIZ (leitura pública da planilha) ==================== */
function gvizUrl(tab) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
}

function splitCSVLine(line) {
  const values = []; let cur = ''; let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQuotes = false; }
      else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { values.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  values.push(cur);
  return values;
}
function parseCSVGeneric(csv) {
  const lines = csv.replace(/\r\n/g, '\n').trim().split('\n');
  return lines.map(l => splitCSVLine(l));
}
function parseCSVToObjects(csv) {
  const lines = csv.replace(/\r\n/g, '\n').trim().split('\n');
  if (lines.length === 0) return [];
  const headers = splitCSVLine(lines[0]).map(h => h.trim());
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const obj = {}; const values = splitCSVLine(lines[i]);
    headers.forEach((h, idx) => { obj[h] = values[idx] !== undefined ? values[idx].trim() : ''; });
    out.push(obj);
  }
  return out;
}

/* ==================== LOGIN ==================== */
window.addEventListener('DOMContentLoaded', () => {
  const existing = loadSession();
  if (existing) {
    userEmail = existing.email;
    enterDashboard();
  }
  document.getElementById('login-btn').addEventListener('click', handleLogin);
  document.getElementById('login-email').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLogin();
  });
});

async function handleLogin() {
  const input = document.getElementById('login-email');
  const statusEl = document.getElementById('login-status');
  const btn = document.getElementById('login-btn');
  const email = (input.value || '').trim().toLowerCase();

  statusEl.className = '';
  statusEl.textContent = '';

  if (!email || email.indexOf('@') === -1) {
    statusEl.className = 'error';
    statusEl.textContent = 'Digite um e-mail válido.';
    return;
  }

  btn.disabled = true;
  statusEl.className = 'info';
  statusEl.textContent = 'Verificando...';

  try {
    const res = await fetch(gvizUrl(AUTH_TAB), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csvText = await res.text();
    const rows = parseCSVGeneric(csvText);

    let allowed = false;
    for (let i = 1; i < rows.length; i++) {
      const candidate = (rows[i][0] || '').trim().toLowerCase();
      if (candidate && candidate === email) { allowed = true; break; }
    }

    if (!allowed) {
      statusEl.className = 'error';
      statusEl.textContent = 'Este e-mail não tem permissão para acessar o dashboard.';
      btn.disabled = false;
      return;
    }

    userEmail = email;
    saveSession({ email: email, date: todayStr() });
    logToBackend('login');
    enterDashboard();
  } catch (err) {
    statusEl.className = 'error';
    statusEl.textContent = 'Erro ao verificar acesso. Tente novamente.';
    btn.disabled = false;
  }
}

function enterDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('user-box').style.display = 'flex';
  document.getElementById('user-email').textContent = userEmail;
  loadData();
}

document.getElementById('logout-btn') && document.getElementById('logout-btn').addEventListener('click', function () {
  clearSession();
  location.reload();
});

/* ==================== BACKEND (log + e-mail) ==================== */
function callBackend(action, extra) {
  const payload = Object.assign({ action: action, email: userEmail }, extra || {});
  return fetch(LOG_WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(r => r.json());
}
function logToBackend(action) {
  if (!LOG_WEBAPP_URL || LOG_WEBAPP_URL.indexOf('COLOQUE_AQUI') === 0) return;
  callBackend(action).catch(() => {});
}

/* ==================== DADOS ==================== */
async function loadData() {
  showStatus('Carregando dados...', 'info');
  try {
    const res = await fetch(gvizUrl(DATA_TAB), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const csvText = await res.text();
    const objects = parseCSVToObjects(csvText);

    allRows = objects.map(obj => EXPOSED_HEADERS.map(h => (obj[h] !== undefined ? obj[h] : '')));

    buildTableHead();
    populateFilterOptions();
    renderTable();
    document.getElementById('status-msg').style.display = 'none';
  } catch (err) {
    showStatus('Não foi possível carregar os dados. Tente atualizar novamente.', 'error');
  }
}

document.getElementById('refresh-btn').addEventListener('click', loadData);

/* ==================== TABELA ==================== */
function buildTableHead() {
  const tr = document.getElementById('table-head');
  tr.innerHTML = '';
  allHeaders.forEach(function (h) {
    const th = document.createElement('th');
    th.textContent = h;
    tr.appendChild(th);
  });
}

function populateFilterOptions() {
  Object.keys(FILTER_COLUMNS).forEach(function (selectId) {
    const colName = FILTER_COLUMNS[selectId];
    const colIndex = allHeaders.indexOf(colName);
    const select = document.getElementById(selectId);
    if (colIndex === -1) return;

    const currentValue = select.value;
    select.innerHTML = '<option value="">Todos</option>';

    const values = new Set();
    allRows.forEach(function (row) {
      const v = row[colIndex];
      if (v !== '' && v !== null && v !== undefined) values.add(String(v));
    });

    Array.from(values).sort().forEach(function (v) {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
    select.value = currentValue;
  });
}

function getFilteredRows() {
  const search = document.getElementById('f-search').value.trim().toLowerCase();
  const activeFilters = {};
  Object.keys(FILTER_COLUMNS).forEach(function (selectId) {
    const val = document.getElementById(selectId).value;
    if (val) activeFilters[FILTER_COLUMNS[selectId]] = val;
  });

  return allRows.filter(function (row) {
    for (const colName in activeFilters) {
      const idx = allHeaders.indexOf(colName);
      if (idx !== -1 && String(row[idx]) !== activeFilters[colName]) return false;
    }
    if (search) {
      const hay = row.join(' ').toLowerCase();
      if (hay.indexOf(search) === -1) return false;
    }
    return true;
  });
}

function renderTable() {
  const rows = getFilteredRows();
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  rows.forEach(function (row) {
    const tr = document.createElement('tr');
    row.forEach(function (cell) {
      const td = document.createElement('td');
      td.textContent = cell === null || cell === undefined ? '' : cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  document.getElementById('results-count').textContent =
    rows.length + ' de ' + allRows.length + ' lojas exibidas';
}

['f-search'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', renderTable);
});
Object.keys(FILTER_COLUMNS).forEach(function (id) {
  document.getElementById(id).addEventListener('change', renderTable);
});

document.getElementById('clear-filters-btn').addEventListener('click', function () {
  document.getElementById('f-search').value = '';
  Object.keys(FILTER_COLUMNS).forEach(function (id) {
    document.getElementById(id).value = '';
  });
  renderTable();
});

/* ==================== STATUS ==================== */
let statusTimer = null;
function showStatus(msg, type) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = type;
  el.style.display = 'block';
  clearTimeout(statusTimer);
  if (type !== 'info') {
    statusTimer = setTimeout(function () { el.style.display = 'none'; }, 5000);
  }
}

/* ==================== BAIXAR CSV ==================== */
document.getElementById('download-btn').addEventListener('click', function () {
  const rows = getFilteredRows();
  const csv = toCsv(allHeaders, rows);
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'relatorio_lojas.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showStatus('CSV baixado com ' + rows.length + ' linha(s).', 'success');
  logToBackend('download');
});

function toCsv(headers, rows) {
  const escape = function (val) {
    let s = val === null || val === undefined ? '' : String(val);
    if (/[",\r\n;]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const lines = [headers.map(escape).join(',')];
  rows.forEach(function (r) { lines.push(r.map(escape).join(',')); });
  return lines.join('\r\n');
}

/* ==================== ENVIAR POR E-MAIL ==================== */
document.getElementById('email-btn').addEventListener('click', function () {
  const btn = this;
  const rows = getFilteredRows();

  if (!LOG_WEBAPP_URL || LOG_WEBAPP_URL.indexOf('COLOQUE_AQUI') === 0) {
    showStatus('Configuração pendente: defina LOG_WEBAPP_URL no topo do index.html.', 'error');
    return;
  }

  btn.disabled = true;
  const originalText = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> Enviando...';

  callBackend('send_email', { headers: allHeaders, rows: rows })
    .then(function (res) {
      if (res.ok) {
        showStatus('Relatório enviado para ' + userEmail + '.', 'success');
      } else {
        showStatus('Não foi possível enviar o e-mail (' + res.error + ').', 'error');
      }
    })
    .catch(function () {
      showStatus('Falha de conexão ao enviar o e-mail.', 'error');
    })
    .finally(function () {
      btn.disabled = false;
      btn.innerHTML = originalText;
    });
});
</script>

</body>
</html>
